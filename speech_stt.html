<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Speech to Text | Bharat Farms</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <style>
    body {
      background: linear-gradient(to right, #e8f9f1, #c4f0e1);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      font-family: 'Segoe UI', sans-serif;
    }
    .card {
      background: #fff;
      padding: 30px 40px;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
      max-width: 600px;
      width: 100%;
    }
    .title {
      font-weight: bold;
      font-size: 1.8rem;
      color: #157347;
    }
    .subtitle {
      font-size: 1rem;
      color: #6c757d;
      margin-bottom: 20px;
    }
    .form-label {
      font-weight: 600;
    }
    .btn-primary {
      background-color: #157347;
      border: none;
    }
    .btn-primary:hover {
      background-color: #0e5139;
    }
    .result-box {
      margin-top: 20px;
      padding: 15px;
      background-color: #e9f8ee;
      border-left: 4px solid #28a745;
      border-radius: 8px;
      font-size: 1rem;
    }
    .error-box {
      margin-top: 20px;
      padding: 15px;
      background-color: #ffe2e2;
      border-left: 4px solid #dc3545;
      border-radius: 8px;
      font-size: 1rem;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="text-center">
      <div class="title">🗣️ Bharat Farms</div>
      <div class="subtitle">Hindi Speech-to-Text Transcription</div>
    </div>

    <form method="POST" enctype="multipart/form-data">
      <div class="mb-3">
        <label for="audio" class="form-label">🎤 Upload .WAV File</label>
        <input type="file" class="form-control" name="audio" id="audio" accept=".wav" required />
        <div class="form-text">Only WAV format supported for now</div>
      </div>
      <button type="submit" class="btn btn-primary w-100">Transcribe Now</button>
    </form>

    {% if result %}
      <div class="result-box mt-4">
        <strong>📋 Transcription Result:</strong><br>
        {{ result }}
      </div>
    {% elif error %}
      <div class="error-box mt-4">
        <strong>⚠️ Error:</strong><br>
        {{ error }}
      </div>
    {% endif %}
  </div>
</body>
</html>
