<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Crop Health Detection | Bharat Farms</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <style>
        body {
            background: linear-gradient(to right, #a8e063, #56ab2f);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .card {
            background: #ffffff;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
            max-width: 500px;
            width: 100%;
            text-align: center;
        }
        h3 {
            color: #2d6a4f;
            font-weight: 700;
        }
        .form-label {
            font-weight: 600;
        }
        .btn-success {
            background-color: #2d6a4f;
            border: none;
        }
        .btn-success:hover {
            background-color: #1b4332;
        }
        .text-muted {
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <div class="card">
        <h3 class="mb-3">🌿 Crop Health Detection</h3>
        <p class="text-muted mb-4">Upload a crop image to detect disease using Dwani AI</p>

        <form method="POST" enctype="multipart/form-data" action="http://127.0.0.1:5002/">
            <div class="mb-3 text-start">
                <label for="file" class="form-label">Select an image</label>
                <input class="form-control" type="file" name="file" id="file" accept="image/*" required />
            </div>
            <button type="submit" class="btn btn-success w-100">🩺 Diagnose</button>
        </form>

        <p class="text-muted mt-4">Results will appear below after diagnosis.</p>
    </div>
</body>
</html>
