<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Bharat Farms — Regional Crop News</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="icon" href="assets/favicon.svg" />
  <link href="assets/css/app.css" rel="stylesheet" />
</head>
<body>
  <nav class="navbar navbar-bf navbar-expand-lg">
    <div class="container bf-container">
      <a class="navbar-brand fw-bold" href="index.html">🌾 Bharat Farms</a>
      <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#nav"><span class="navbar-toggler-icon"></span></button>
      <div class="collapse navbar-collapse" id="nav">
        <div class="navbar-nav ms-auto">
          <a class="nav-link" href="index.html">Dashboard</a>
          <a class="nav-link" href="map.html">My Plots</a>
          <a class="nav-link" href="market.html">Market</a>
          <a class="nav-link" href="news.html">News</a>
          <a class="nav-link" href="crop-health.html">Crop Health</a>
          <a class="nav-link" href="weather.html">Weather</a>
        </div>
      </div>
    </div>
  </nav>

  <main class="container bf-container py-4">
    <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-3">
      <div>
        <h1 class="h4 mb-1">Regional crop news</h1>
        <p class="text-muted small mb-0">Headlines for your crops &amp; region, labelled by likely impact on grower income.</p>
      </div>
      <button id="refresh" class="btn btn-success">↻ Fetch latest</button>
    </div>

    <div class="d-flex gap-2 mb-3 flex-wrap">
      <select id="f-crop" class="form-select form-select-sm w-auto"><option value="">All crops</option></select>
      <select id="f-impact" class="form-select form-select-sm w-auto">
        <option value="">All impact</option>
        <option value="positive">Good for you</option>
        <option value="negative">Watch out</option>
        <option value="neutral">Neutral</option>
      </select>
    </div>

    <div id="feed" class="row g-3"><div class="col-12 text-muted small">Loading…</div></div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/device.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/voice.js"></script>
  <script src="assets/js/app.js"></script>
  <script src="assets/js/news.js"></script>
</body>
