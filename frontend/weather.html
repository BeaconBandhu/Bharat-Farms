<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Bharat Farms — Weather</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="icon" href="assets/favicon.svg" />
  <link href="assets/css/app.css" rel="stylesheet" />
</head>
<body>
  <nav class="navbar navbar-bf navbar-expand-lg">
    <div class="container bf-container">
      <a class="navbar-brand fw-bold" href="index.html">🌾 Bharat Farms</a>
      <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#nav"><span class="navbar-toggler-icon"></span></button>
      <div class="collapse navbar-collapse" id="nav">
        <div class="navbar-nav ms-auto">
          <a class="nav-link" href="index.html">Dashboard</a>
          <a class="nav-link" href="map.html">My Plots</a>
          <a class="nav-link" href="market.html">Market</a>
          <a class="nav-link" href="news.html">News</a>
          <a class="nav-link" href="crop-health.html">Crop Health</a>
          <a class="nav-link" href="weather.html">Weather</a>
        </div>
      </div>
    </div>
  </nav>

  <main class="container bf-container py-4" style="max-width: 780px;">
    <h1 class="h4 mb-3">Weather</h1>
    <div class="bf-card p-3 mb-3">
      <div class="row g-2 align-items-end">
        <div class="col"><label class="form-label small mb-1">Latitude</label><input id="lat" class="form-control form-control-sm" value="12.97" /></div>
        <div class="col"><label class="form-label small mb-1">Longitude</label><input id="lon" class="form-control form-control-sm" value="77.59" /></div>
        <div class="col-auto"><button id="loc" class="btn btn-outline-success btn-sm">📍 Use my location</button></div>
        <div class="col-auto"><button id="go" class="btn btn-success btn-sm">Get weather</button></div>
      </div>
    </div>
    <div id="out" class="text-muted small">Enter coordinates and press “Get weather”.</div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/device.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/voice.js"></script>
  <script src="assets/js/app.js"></script>
  <script>
    var out = document.getElementById("out");

    document.getElementById("loc").addEventListener("click", function () {
      if (!navigator.geolocation) return BF.toast("Geolocation unavailable.", "warning");
      navigator.geolocation.getCurrentPosition(function (p) {
        document.getElementById("lat").value = p.coords.latitude.toFixed(4);
        document.getElementById("lon").value = p.coords.longitude.toFixed(4);
      });
    });

    document.getElementById("go").addEventListener("click", async function () {
      var lat = document.getElementById("lat").value, lon = document.getElementById("lon").value;
      out.innerHTML = "Loading…";
      try {
        var w = await BF.api.get("/api/weather?lat=" + lat + "&lon=" + lon);
        out.innerHTML =
          '<div class="bf-card p-3 mb-3"><h2 class="h5 mb-1">' + w.location + "</h2>" +
          '<div class="display-6">' + w.current.temp + "°C</div>" +
          '<div class="text-muted">' + w.current.condition + " • feels " + w.current.feels_like +
          "°C • humidity " + w.current.humidity + "% • wind " + w.current.wind_speed + " m/s</div></div>" +
          '<div class="row g-2">' +
          w.forecast
            .map(function (d) {
              return (
                '<div class="col"><div class="bf-card p-2 text-center"><div class="small text-muted">' +
                d.date.slice(5) + "</div><div class='fw-semibold'>" + d.temp_min + "–" + d.temp_max +
                "°</div><div class='small'>" + d.condition + "</div></div></div>"
              );
            })
            .join("") +
          "</div>";
      } catch (e) {
        out.innerHTML =
          '<span class="text-danger">' +
          (e.status === 503 ? "Weather needs OPENWEATHER_API_KEY in backend/.env." : e.message) +
          "</span>";
      }
    });
  </script>
</body>
</html>
