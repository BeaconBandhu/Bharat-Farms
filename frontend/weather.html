<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>🌤 Weather &amp; Crop Advice | Bharat Farms</title>
  <link rel="icon" href="images/favicon-32x32.png" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <style>
    body {
      background: linear-gradient(to right, #d0f0c0, #f0fff3);
      min-height: 100vh;
      padding: 2rem;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    .card {
      background-color: #ffffffdd;
      border-radius: 20px;
      padding: 40px 30px;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.15);
      width: 100%;
      max-width: 960px;
    }
    h2 { font-weight: 700; color: #2f4f4f; }
    p { color: #555; font-size: 1.05rem; }
    .footer-note { font-size: 0.9rem; color: #777; text-align: center; margin-top: 1rem; }
    .day { border: 1px solid #cbe3cb; border-radius: 10px; padding: 8px; text-align: center; }
  </style>
</head>
<body>
  <div class="card">
    <h2 class="text-center mb-3">🌾 Weather Forecast &amp; Crop Advice</h2>
    <p class="text-center mb-4">Real-time weather + 5-day outlook for your field, with soil &amp; rainfall data when Agromonitoring is configured.</p>

    <div class="row g-2 align-items-end justify-content-center mb-3">
      <div class="col-auto"><label class="form-label mb-0 small">Latitude</label><input id="lat" class="form-control form-control-sm" value="12.52" /></div>
      <div class="col-auto"><label class="form-label mb-0 small">Longitude</label><input id="lon" class="form-control form-control-sm" value="76.90" /></div>
      <div class="col-auto"><button id="loc" class="btn btn-outline-success btn-sm">📍 My location</button></div>
      <div class="col-auto"><button id="go" class="btn btn-success btn-sm">Get weather</button></div>
    </div>

    <div id="out" class="text-muted text-center">Enter coordinates and press “Get weather”.</div>

    <div class="footer-note">📡 Data from OpenWeather. Lock a plot on the <a href="map.html">Map</a> for soil moisture, NDVI and accumulated rainfall.</div>
  </div>

  <script src="assets/js/device.js"></script>
  <script src="assets/js/api.js"></script>
  <script>
    var out = document.getElementById("out");
    document.getElementById("loc").addEventListener("click", function () {
      if (!navigator.geolocation) return;
      navigator.geolocation.getCurrentPosition(function (p) {
        document.getElementById("lat").value = p.coords.latitude.toFixed(4);
        document.getElementById("lon").value = p.coords.longitude.toFixed(4);
      });
    });
    document.getElementById("go").addEventListener("click", async function () {
      var lat = document.getElementById("lat").value, lon = document.getElementById("lon").value;
      out.innerHTML = "Loading…";
      try {
        var w = await BF.api.get("/api/weather?lat=" + lat + "&lon=" + lon);
        out.innerHTML =
          '<h3 class="h4 mb-0">' + w.location + "</h3>" +
          '<div class="display-6">' + w.current.temp + "°C</div>" +
          '<div class="text-muted mb-3">' + w.current.condition + " • feels " + w.current.feels_like +
          "°C • humidity " + w.current.humidity + "% • wind " + w.current.wind_speed + " m/s</div>" +
          '<div class="row g-2">' + w.forecast.map(function (d) {
            return '<div class="col"><div class="day"><div class="small text-muted">' + d.date.slice(5) +
              '</div><div class="fw-semibold">' + d.temp_min + "–" + d.temp_max + "°</div><div class='small'>" +
              d.condition + "</div></div></div>";
          }).join("") + "</div>";
      } catch (e) {
        out.innerHTML = '<span class="text-danger">' +
          (e.status === 503 ? "Set OPENWEATHER_API_KEY in backend/.env (new keys take ~1–2 h to activate)." : e.message) + "</span>";
      }
    });
  </script>
</body>
</html>
