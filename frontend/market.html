<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Bharat Farms — Crop Market</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="icon" href="assets/favicon.svg" />
  <link href="assets/css/app.css" rel="stylesheet" />
</head>
<body>
  <nav class="navbar navbar-bf navbar-expand-lg">
    <div class="container bf-container">
      <a class="navbar-brand fw-bold" href="index.html">🌾 Bharat Farms</a>
      <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#nav"><span class="navbar-toggler-icon"></span></button>
      <div class="collapse navbar-collapse" id="nav">
        <div class="navbar-nav ms-auto">
          <a class="nav-link" href="index.html">Dashboard</a>
          <a class="nav-link" href="map.html">My Plots</a>
          <a class="nav-link" href="market.html">Market</a>
          <a class="nav-link" href="news.html">News</a>
          <a class="nav-link" href="crop-health.html">Crop Health</a>
          <a class="nav-link" href="weather.html">Weather</a>
        </div>
      </div>
    </div>
  </nav>

  <main class="container bf-container py-4">
    <h1 class="h4 mb-2">Crop market</h1>
    <p class="text-muted small">Live wholesale (mandi) modal prices from Agmarknet / data.gov.in, tracked like stock quotes.</p>

    <div class="ticker mb-4"><div id="ticker" class="ticker-track"></div></div>

    <div class="row g-3">
      <div class="col-lg-5">
        <div class="bf-card p-3">
          <h2 class="h6">Add to watchlist</h2>
          <div class="row g-2">
            <div class="col-7">
              <input id="w-commodity" class="form-control form-control-sm" list="commodity-list" placeholder="Commodity e.g. Onion" />
              <datalist id="commodity-list"></datalist>
            </div>
            <div class="col-5">
              <select id="w-state" class="form-select form-select-sm"><option value="">All India</option></select>
            </div>
          </div>
          <button id="w-add" class="btn btn-success btn-sm w-100 mt-2">Add</button>
          <div id="w-suggest" class="small mt-2"></div>
        </div>
      </div>
      <div class="col-lg-7">
        <div class="bf-card p-3">
          <h2 class="h6">Quote lookup</h2>
          <div class="row g-2">
            <div class="col-7">
              <input id="q-commodity" class="form-control form-control-sm" list="commodity-list" placeholder="Commodity" />
            </div>
            <div class="col-5">
              <select id="q-state" class="form-select form-select-sm"><option value="">All India</option></select>
            </div>
          </div>
          <button id="q-go" class="btn btn-outline-success btn-sm w-100 mt-2">Get quote</button>
          <div id="q-result" class="mt-2"></div>
          <canvas id="q-chart" height="80" class="mt-2"></canvas>
        </div>
      </div>
    </div>

    <h2 class="h6 mt-4">Your watchlist</h2>
    <div class="table-responsive bf-card p-0">
      <table class="table table-hover align-middle mb-0">
        <thead class="table-light">
          <tr><th>Commodity</th><th>Region</th><th class="text-end">Modal ₹/qtl</th><th class="text-end">Day change</th><th>45-day trend</th><th></th></tr>
        </thead>
        <tbody id="wl-body"><tr><td colspan="6" class="text-muted small">Loading…</td></tr></tbody>
      </table>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
  <script src="assets/js/device.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/voice.js"></script>
  <script src="assets/js/app.js"></script>
  <script src="assets/js/market.js"></script>
</body>
</html>
