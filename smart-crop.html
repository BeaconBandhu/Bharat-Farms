<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Crop Recommendation | Bharat Farms</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background: linear-gradient(to right, #c2e9fb, #a1c4fd);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    .card {
      border-radius: 20px;
      padding: 40px;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.15);
      background-color: #ffffff;
      width: 100%;
      max-width: 700px;
    }
    .title {
      font-weight: bold;
      font-size: 2rem;
      color: #1f4e79;
      margin-bottom: 1rem;
    }
    .form-label {
      font-weight: 600;
    }
    .form-control, .form-select {
      margin-bottom: 1rem;
    }
    .btn-success {
      width: 100%;
      font-weight: 600;
      background: linear-gradient(90deg, #43e97b 0%, #38f9d7 100%);
      border: none;
    }
    .btn-success:hover {
      background: linear-gradient(90deg, #38f9d7 0%, #43e97b 100%);
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="title text-center">🌾 BHARAT FARMS<br/><small class="text-muted">Smart Crop Recommendation</small></div>
    <form method="POST">
      <div class="row">
        <div class="col-md-6">
          <label for="location" class="form-label">📍 Location</label>
          <input type="text" class="form-control" id="location" name="location" placeholder="Nagpur">
        </div>
        <div class="col-md-6">
          <label for="soilType" class="form-label">🧱 Soil Type</label>
          <select class="form-select" id="soilType" name="soilType">
            <option selected>Clay Loam</option>
            <option>Loamy</option>
            <option>Sandy</option>
            <option>Black Soil</option>
          </select>
        </div>
      </div>
      <div class="row">
        <div class="col-md-6">
          <label for="season" class="form-label">📅 Season</label>
          <select class="form-select" id="season" name="season">
            <option selected>Kharif</option>
            <option>Rabi</option>
            <option>Zaid</option>
          </select>
        </div>
        <div class="col-md-6">
          <label for="rainfall" class="form-label">🌧 Rainfall (mm)</label>
          <input type="number" class="form-control" id="rainfall" name="rainfall" value="800">
        </div>
      </div>
      <div class="row">
        <div class="col-md-6">
          <label for="landSize" class="form-label">📐 Land Size (ha)</label>
          <input type="number" class="form-control" id="landSize" name="landSize" value="2">
        </div>
        <div class="col-md-6">
          <label for="budget" class="form-label">💰 Budget (₹)</label>
          <input type="text" class="form-control" id="budget" name="budget" value="50000">
        </div>
      </div>
      <button type="submit" class="btn btn-success mt-3">🌿 Predict My Next Crop</button>
    </form>
  </div>
</body>
</html>
