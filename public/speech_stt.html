<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Speech to Text | Bharat Farms</title>
  <link rel="icon" href="images/favicon-32x32.png" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <style>
    body {
      background: linear-gradient(to right, #e8f9f1, #c4f0e1);
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      padding: 2rem; font-family: 'Segoe UI', sans-serif;
    }
    .card {
      background: #fff; padding: 30px 40px; border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1); max-width: 620px; width: 100%;
    }
    .title { font-weight: bold; font-size: 1.8rem; color: #157347; }
    .subtitle { font-size: 1rem; color: #6c757d; margin-bottom: 20px; }
    .form-label { font-weight: 600; }
    .btn-primary { background-color: #157347; border: none; }
    .btn-primary:hover { background-color: #0e5139; }
    .result-box { margin-top: 20px; padding: 15px; background:#e9f8ee; border-left:4px solid #28a745; border-radius:8px; }
    .error-box { margin-top: 20px; padding: 15px; background:#ffe2e2; border-left:4px solid #dc3545; border-radius:8px; }
    .rec-on { background:#dc3545 !important; }
  </style>
</head>
<body>
  <div class="card">
    <div class="text-center">
      <div class="title">🗣️ Bharat Farms</div>
      <div class="subtitle">Speech-to-Text in your language (OpenAI)</div>
    </div>

    <div class="mb-3">
      <label class="form-label">Language</label>
      <select id="lang" class="form-select">
        <option value="hi">हिन्दी</option><option value="en">English</option>
        <option value="bn">বাংলা</option><option value="te">తెలుగు</option>
        <option value="mr">मराठी</option><option value="ta">தமிழ்</option>
        <option value="gu">ગુજરાતી</option><option value="kn">ಕನ್ನಡ</option>
        <option value="ml">മലയാളം</option><option value="pa">ਪੰਜਾਬੀ</option>
        <option value="or">ଓଡ଼ିଆ</option><option value="as">অসমীয়া</option><option value="ur">اردو</option>
      </select>
    </div>

    <div class="d-flex gap-2 mb-3">
      <button id="mic" class="btn btn-primary flex-fill">🎤 Start recording</button>
    </div>
    <div class="mb-3">
      <label for="audio" class="form-label">…or upload an audio file</label>
      <input type="file" class="form-control" id="audio" accept="audio/*" />
      <button id="up" class="btn btn-outline-secondary btn-sm mt-2">Transcribe file</button>
    </div>

    <div id="result" class="result-box d-none"><strong>📋 Transcript:</strong><br><span id="rtext"></span></div>
    <div id="error" class="error-box d-none"></div>
  </div>

  <script src="assets/js/device.js"></script>
  <script src="assets/js/api.js"></script>
  <script>
    var rec = null, chunks = [];
    function showErr(m){ var e=document.getElementById("error"); e.textContent=m; e.classList.remove("d-none"); }
    function showText(t){ document.getElementById("rtext").textContent=t; document.getElementById("result").classList.remove("d-none"); }

    async function send(blob, name) {
      document.getElementById("error").classList.add("d-none");
      var fd = new FormData();
      fd.append("file", blob, name);
      fd.append("language", document.getElementById("lang").value);
      try {
        var r = await BF.api.postForm("/api/voice/stt", fd);
        showText(r.text || "(no speech detected)");
      } catch (e) {
        showErr(e.status === 503 ? "Set OPENAI_API_KEY in backend/.env to enable transcription." : e.message);
      }
    }

    document.getElementById("mic").addEventListener("click", async function () {
      if (rec && rec.state === "recording") { rec.stop(); return; }
      if (!navigator.mediaDevices || !window.MediaRecorder) return showErr("Recording not supported in this browser.");
      try {
        var stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        rec = new MediaRecorder(stream); chunks = [];
        rec.ondataavailable = function (e) { if (e.data.size) chunks.push(e.data); };
        rec.onstop = function () {
          stream.getTracks().forEach(function (t) { t.stop(); });
          document.getElementById("mic").classList.remove("rec-on");
          document.getElementById("mic").textContent = "🎤 Start recording";
          send(new Blob(chunks, { type: "audio/webm" }), "speech.webm");
        };
        rec.start();
        this.classList.add("rec-on");
        this.textContent = "⏹️ Stop & transcribe";
      } catch (e) { showErr("Could not access the microphone."); }
    });

    document.getElementById("up").addEventListener("click", function () {
      var f = document.getElementById("audio").files[0];
      if (f) send(f, f.name);
    });
  </script>
</body>
</html>
