<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Revenue Estimator | Bharat Farms</title>
  <link rel="icon" href="images/favicon-32x32.png" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <style>
    body {
      background: linear-gradient(to right, #f9f871, #a1c4fd);
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    .card {
      background-color: #ffffffee;
      border-radius: 20px;
      padding: 30px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
      max-width: 500px;
      width: 100%;
    }
    .form-label {
      font-weight: 600;
    }
    .multi-crop {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }
    .multi-crop .badge {
      cursor: pointer;
      padding: 10px 15px;
      font-size: 1rem;
      background-color: #e7f5ff;
      border: 2px solid #74c0fc;
      color: #1c7ed6;
      border-radius: 20px;
      transition: all 0.3s ease-in-out;
    }
    .multi-crop .badge:hover {
      background-color: #d0ebff;
    }
    .badge-selected {
      background-color: #51cf66 !important;
      color: white !important;
      border-color: #37b24d !important;
    }
    .btn-custom {
      background: linear-gradient(90deg, #74b816, #4dabf7);
      border: none;
      color: white;
      font-weight: 600;
    }
    .btn-custom:hover {
      background: linear-gradient(90deg, #4dabf7, #74b816);
    }
  </style>
</head>
<body>
  <div class="card text-center">
    <h3 style="color:#2f9e44; font-weight:bold;">BHARAT FARMS</h3>
    <p class="text-muted">Revenue Estimator</p>
    <p>Select the crops, enter your field size and market price.</p>

    <div class="mb-3 text-start">
      <label class="form-label">Crops</label>
      <div class="multi-crop" id="cropList">
        <span class="badge" data-crop="Wheat">Wheat</span>
        <span class="badge" data-crop="Rice">Rice</span>
        <span class="badge" data-crop="Maize">Maize</span>
        <span class="badge" data-crop="Soybean">Soybean</span>
        <span class="badge" data-crop="Sugarcane">Sugarcane</span>
      </div>
    </div>

    <div class="row g-2 mb-2">
      <div class="col">
        <input type="number" id="fieldSize" class="form-control" placeholder="Field Size (ha)" value="4" />
      </div>
      <div class="col">
        <input type="number" id="marketPrice" class="form-control" placeholder="₹/quintal" value="3750" />
      </div>
    </div>
    <button class="btn btn-outline-secondary btn-sm w-100 mb-3" id="livePrice" type="button">
      ⤵ Use live mandi price for the selected crop
    </button>

    <button class="btn btn-custom w-100 mb-3" onclick="calculateRevenue()">💰 Calculate Revenue</button>
    <h5 class="text-muted">Estimated Revenue</h5>
    <h2 id="revenueResult">₹ 0</h2>
  </div>

  <script src="assets/js/device.js"></script>
  <script src="assets/js/api.js"></script>
  <script>
    const selectedCrops = new Set();

    document.getElementById('livePrice').addEventListener('click', async () => {
      const crop = [...selectedCrops][selectedCrops.size - 1];
      if (!crop) { alert('Pick a crop first.'); return; }
      try {
        const q = await BF.api.get('/api/prices?commodity=' + encodeURIComponent(crop));
        if (q.available && q.modal_price) {
          document.getElementById('marketPrice').value = q.modal_price;
          calculateRevenue();
        } else {
          alert(q.reason || ('No live price for ' + crop + ' yet.'));
        }
      } catch (e) {
        alert(e.message);
      }
    });

    document.querySelectorAll('#cropList .badge').forEach(badge => {
      badge.addEventListener('click', () => {
        const crop = badge.getAttribute('data-crop');
        if (selectedCrops.has(crop)) {
          selectedCrops.delete(crop);
          badge.classList.remove('badge-selected');
        } else {
          selectedCrops.add(crop);
          badge.classList.add('badge-selected');
        }
      });
    });

    function calculateRevenue() {
      const size = parseFloat(document.getElementById('fieldSize').value);
      const price = parseFloat(document.getElementById('marketPrice').value);
      const cropCount = selectedCrops.size;
      if (!size || !price || cropCount === 0) {
        document.getElementById('revenueResult').textContent = '₹ 0';
        return;
      }
      const estimatedYieldPerCrop = 15; // quintals per hectare (example value)
      const totalRevenue = size * price * estimatedYieldPerCrop * cropCount;
      document.getElementById('revenueResult').textContent = `₹ ${totalRevenue.toLocaleString()}`;
    }
  </script>
</body>
</html>
