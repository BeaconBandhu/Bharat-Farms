<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Bharat Farms — Map a plot</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/@geoman-io/leaflet-geoman-free@2.17.0/dist/leaflet-geoman.css" rel="stylesheet" />
  <link rel="icon" href="assets/favicon.svg" />
  <link href="assets/css/app.css" rel="stylesheet" />
</head>
<body>
  <nav class="navbar navbar-bf navbar-expand-lg">
    <div class="container bf-container">
      <a class="navbar-brand fw-bold" href="index.html">🌾 Bharat Farms</a>
      <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#nav"><span class="navbar-toggler-icon"></span></button>
      <div class="collapse navbar-collapse" id="nav">
        <div class="navbar-nav ms-auto">
          <a class="nav-link" href="index.html">Dashboard</a>
          <a class="nav-link" href="map.html">My Plots</a>
          <a class="nav-link" href="market.html">Market</a>
          <a class="nav-link" href="news.html">News</a>
          <a class="nav-link" href="crop-health.html">Crop Health</a>
          <a class="nav-link" href="weather.html">Weather</a>
        </div>
      </div>
    </div>
  </nav>

  <main class="container bf-container py-4">
    <h1 class="h4 mb-3">Map &amp; lock a plot</h1>
    <div class="row g-3">
      <div class="col-lg-8">
        <div class="bf-card p-2"><div id="map"></div></div>
        <p class="small text-muted mt-2">
          Use the polygon tool (top-left of the map) to trace your field, then lock it below.
        </p>
      </div>
      <div class="col-lg-4">
        <div class="bf-card p-3 mb-3">
          <h2 class="h6">Lock this plot</h2>
          <div class="mb-2">
            <label class="form-label small mb-1">Plot name</label>
            <input id="plot-name" class="form-control form-control-sm" value="My plot" />
          </div>
          <div id="plot-meta" class="small text-muted mb-2">Draw a polygon to begin.</div>
          <button id="lock-btn" class="btn btn-success w-100" disabled>🔒 Lock plot</button>
        </div>
        <div class="bf-card p-3">
          <h2 class="h6">Your plots</h2>
          <div id="plot-list" class="small text-muted">Loading…</div>
        </div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@geoman-io/leaflet-geoman-free@2.17.0/dist/leaflet-geoman.min.js"></script>
  <script src="assets/js/device.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/voice.js"></script>
  <script src="assets/js/app.js"></script>
  <script src="assets/js/map.js"></script>
</body>
</html>
