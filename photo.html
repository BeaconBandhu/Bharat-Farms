<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Crop Health Detection | Bharat Farms</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <style>
        body {
            background: url('https://images.unsplash.com/photo-1501004318641-b39e6451bec6?ixlib=rb-4.0.3&auto=format&fit=crop&w=1950&q=80') no-repeat center center;
            background-size: cover;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .card {
            background: #ffffffee;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 500px;
        }
    </style>
</head>
<body>
    <div class="card text-center">
        <h3>Crop Health Detection</h3>
        <p class="text-muted">Upload a crop image to detect disease using Dwani AI</p>

        <form method="POST" enctype="multipart/form-data" action="http://127.0.0.1:5000/">
            <div class="mb-3 text-start">
                <label for="file" class="form-label">Select an image</label>
                <input class="form-control" type="file" name="file" id="file" accept="image/*" required />
            </div>
            <button type="submit" class="btn btn-success w-100">Diagnose</button>
        </form>

        <p class="text-muted mt-3">Results will be shown below on the same page.</p>
    </div>
</body>
</html>
