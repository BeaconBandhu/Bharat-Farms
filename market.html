<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Market Analysis | Bharat Farms</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background: url('https://unsplash.com/photos/a-field-of-tall-green-grass-under-a-blue-sky-yoDfLrMugd0' )no-repeat center center;
      background-size: cover;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card {
      background: #ffffffee;
      border-radius: 20px;
      padding: 30px;
      max-width: 700px;
      width: 100%;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
    }
    .section-title {
      font-size: 1.5rem;
      font-weight: bold;
      margin-bottom: 1rem;
    }
    .price-box {
      border: 1px solid #ddd;
      border-radius: 10px;
      padding: 10px;
      text-align: center;
      margin-bottom: 1rem;
    }
    .price-box h5 {
      margin: 0;
      font-weight: bold;
    }
    .chart-box {
      background: #f9f9f9;
      border-radius: 10px;
      padding: 1rem;
      margin-bottom: 1rem;
    }
  </style>
</head>
<body>
  <div class="card">
    <h3 class="text-center mb-4">BHARAT FARMS<br><small class="text-muted">Market Analysis</small></h3>

    <div class="row mb-3">
      <div class="col">
        <label for="location" class="form-label">Location</label>
        <select id="location" class="form-select">
          <option selected>Nagpur</option>
          <option>Delhi</option>
          <option>Pune</option>
        </select>
      </div>
      <div class="col">
        <label for="month" class="form-label">Date</label>
        <input type="month" id="month" class="form-control" value="2024-04">
      </div>
    </div>

    <div class="mb-3">
      <label for="cropSelect" class="form-label">Compare Crops</label>
      <select id="cropSelect" class="form-select" multiple>
        <option selected>Wheat</option>
        <option selected>Rice</option>
        <option>Maize</option>
        <option>Soybean</option>
        <option>Sugarcane</option>
      </select>
    </div>

    <div class="section-title">Price Trends</div>
    <div class="chart-box">
      <canvas id="priceTrendsChart" height="200"></canvas>
    </div>

    <div class="d-flex justify-content-between mb-4">
      <div class="price-box flex-fill me-2">
        <h5>Wheat</h5>
        <div>₹ 2,840/q</div>
      </div>
      <div class="price-box flex-fill">
        <h5>Rice</h5>
        <div>₹ 3,150/q</div>
      </div>
    </div>

    <div class="section-title">Future Price Prediction</div>
    <div class="chart-box">
      <canvas id="futurePriceChart" height="200"></canvas>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script>
    const cropData = {
      Wheat: [1000, 1500, 1700, 2100, 2600, 2840],
      Rice: [1200, 1300, 1400, 1600, 1800, 3150],
      Maize: [800, 950, 1100, 1300, 1500, 1700],
      Soybean: [900, 1000, 1150, 1350, 1550, 1800],
      Sugarcane: [1500, 1600, 1750, 1900, 2100, 2300]
    };

    const labels = ['Nov', 'Dec', 'Jan', 'Feb', 'Mar', 'Apr'];

    const ctx1 = document.getElementById('priceTrendsChart').getContext('2d');
    const priceTrendsChart = new Chart(ctx1, {
      type: 'line',
      data: {
        labels: labels,
        datasets: []
      },
      options: {
        responsive: true,
        plugins: { legend: { position: 'top' } },
        scales: { y: { beginAtZero: true } }
      }
    });

    function updateChart(selectedCrops) {
      const colors = ['#f5a623', '#27ae60', '#2980b9', '#8e44ad', '#d35400'];
      priceTrendsChart.data.datasets = selectedCrops.map((crop, i) => ({
        label: crop,
        data: cropData[crop],
        borderColor: colors[i % colors.length],
        backgroundColor: colors[i % colors.length] + '33',
        fill: true
      }));
      priceTrendsChart.update();
    }

    const cropSelect = document.getElementById('cropSelect');
    cropSelect.addEventListener('change', () => {
      const selected = Array.from(cropSelect.selectedOptions).map(opt => opt.value);
      updateChart(selected);
    });

    updateChart(['Wheat', 'Rice']); // Initial load

    const ctx2 = document.getElementById('futurePriceChart').getContext('2d');
    const futurePriceChart = new Chart(ctx2, {
      type: 'line',
      data: {
        labels: ['2nd May', '10th May', '20th May', '31st May'],
        datasets: [{
          label: 'Predicted Price',
          data: [2100, 2300, 2700, 2940],
          borderColor: '#27ae60',
          backgroundColor: 'rgba(39, 174, 96, 0.2)',
          fill: true,
        }]
      },
      options: {
        responsive: true,
        plugins: { legend: { display: false } },
        scales: { y: { beginAtZero: true } }
      }
    });
  </script>
</body>
</html>
